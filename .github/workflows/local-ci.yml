#Developed by Shawon
name: Bangla Karneval CI


on:
  push:
    branches: [devops]
  pull_request:
    branches: [devops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t bangla-karneval:ci .
  
  approve-deployment:
    name: Approve Local Deployment
    runs-on: ubuntu-latest
    needs: [build-test, docker-build]
    if: github.ref == 'refs/heads/devops' && github.event_name == 'push'
    environment:
      name: local-deployment

    steps:
      - name: Confirm deployment approval
        run: |
          echo "Deployment approved!"
          echo "Commit: $GITHUB_SHA"
          echo "Ready for manual local deployment"

